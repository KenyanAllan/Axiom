AWSTemplateFormatVersion: "2010-09-09"
Description: Axiom ECS Fargate stack — API + Celery worker

Parameters:
  EnvironmentName:
    Type: String
    Default: axiom
    Description: Name prefix for all resources

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to deploy into

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for ALB

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for ECS tasks

  ImageUri:
    Type: String
    Description: ECR image URI (e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com/axiom:latest)

  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: "Async DB URL (postgresql+asyncpg://...)"

  SyncDatabaseUrl:
    Type: String
    NoEcho: true
    Description: "Sync DB URL (postgresql+psycopg2://...)"

  RedisUrl:
    Type: String
    NoEcho: true
    Description: "ElastiCache Redis URL (redis://...)"

  JwtSecretKey:
    Type: String
    NoEcho: true
    Description: JWT signing secret

  S3BucketName:
    Type: String
    Default: axiom-source-documents

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated allowed origins

  ApiCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]

  ApiMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096"]

  WorkerCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]

  WorkerMemory:
    Type: String
    Default: "1024"
    AllowedValues: ["512", "1024", "2048", "4096"]

Resources:
  # ── ECS Cluster ──────────────────────────────────────────────────────────────

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ── Log Groups ───────────────────────────────────────────────────────────────

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/api"
      RetentionInDays: 14

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/worker"
      RetentionInDays: 14

  # ── IAM Roles ────────────────────────────────────────────────────────────────

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ecs-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ecs-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AxiomTaskPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BedrockAccess
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:Converse
                Resource: "*"
              - Sid: S3Access
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::${S3BucketName}/*"
              - Sid: TranscribeAccess
                Effect: Allow
                Action:
                  - transcribe:StartTranscriptionJob
                  - transcribe:GetTranscriptionJob
                Resource: "*"
              - Sid: PollyAccess
                Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                Resource: "*"

  # ── Security Groups ──────────────────────────────────────────────────────────

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ── ALB ──────────────────────────────────────────────────────────────────────

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-api-tg"
      Port: 8000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckTimeoutSeconds: 10

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ── API Task Definition ──────────────────────────────────────────────────────

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-api"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref ApiCpu
      Memory: !Ref ApiMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Command: ["api"]
          Essential: true
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: SYNC_DATABASE_URL
              Value: !Ref SyncDatabaseUrl
            - Name: REDIS_URL
              Value: !Ref RedisUrl
            - Name: JWT_SECRET_KEY
              Value: !Ref JwtSecretKey
            - Name: S3_BUCKET_NAME
              Value: !Ref S3BucketName
            - Name: CORS_ORIGINS
              Value: !Ref CorsOrigins
            - Name: AWS_DEFAULT_REGION
              Value: !Ref "AWS::Region"
            - Name: BEDROCK_MODEL_ID
              Value: anthropic.claude-3-5-sonnet-20241022-v2:0
            - Name: BEDROCK_EMBED_MODEL_ID
              Value: amazon.titan-embed-text-v2:0
            - Name: LOG_LEVEL
              Value: info
            - Name: UVICORN_WORKERS
              Value: "2"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api

  # ── Worker Task Definition ───────────────────────────────────────────────────

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-worker"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ImageUri
          Command: ["worker"]
          Essential: true
          Environment:
            - Name: DATABASE_URL
              Value: !Ref DatabaseUrl
            - Name: SYNC_DATABASE_URL
              Value: !Ref SyncDatabaseUrl
            - Name: REDIS_URL
              Value: !Ref RedisUrl
            - Name: S3_BUCKET_NAME
              Value: !Ref S3BucketName
            - Name: AWS_DEFAULT_REGION
              Value: !Ref "AWS::Region"
            - Name: BEDROCK_MODEL_ID
              Value: anthropic.claude-3-5-sonnet-20241022-v2:0
            - Name: BEDROCK_EMBED_MODEL_ID
              Value: amazon.titan-embed-text-v2:0
            - Name: LOG_LEVEL
              Value: info
            - Name: CELERY_CONCURRENCY
              Value: "2"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: worker

  # ── ECS Services ─────────────────────────────────────────────────────────────

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: !Sub "${EnvironmentName}-api"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref EcsSecurityGroup
      LoadBalancers:
        - TargetGroupArn: !Ref TargetGroup
          ContainerName: api
          ContainerPort: 8000
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${EnvironmentName}-worker"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref EcsSecurityGroup

  # ── Auto Scaling ─────────────────────────────────────────────────────────────

  ApiScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${ApiService.Name}"
      MinCapacity: 1
      MaxCapacity: 4
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  ApiScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${EnvironmentName}-api-cpu-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ApiScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

Outputs:
  ClusterName:
    Value: !Ref Cluster

  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
    Description: ALB URL — point your frontend API base URL here

  ApiServiceName:
    Value: !GetAtt ApiService.Name

  WorkerServiceName:
    Value: !GetAtt WorkerService.Name
